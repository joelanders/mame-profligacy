name: Build documentation

on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/**'
    - 'docs/**'
  # Not a Prophecy check: it ran twice per pull request push (push and
  # pull_request) and tests nothing the fork changes.  Keep it for master
  # and on demand, like the CI builds; pull requests use the no-ROM gate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y librsvg2-bin latexmk python3-pip python3-sphinx texlive texlive-formats-extra texlive-science
        pip3 install sphinxcontrib-svg2pdfconverter
    - name: Build HTML
      run: make -C docs html
    - name: Build PDF
      run: make -C docs PAPER=a4 latexpdf
    - uses: actions/upload-artifact@main
      with:
        name: mame-docs-${{ github.sha }}
        path: |
          docs/build/html
          docs/build/latex/MAME.pdf
        if-no-files-found: error
