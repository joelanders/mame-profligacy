name: Compile UI translations

on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/**'
    - 'language/**'
  # Not a Prophecy check: it ran twice per pull request push (push and
  # pull_request) and tests nothing the fork changes.  Keep it for master
  # and on demand, like the CI builds; pull requests use the no-ROM gate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-language:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Compile message catalogs
      run: for x in language/*/*.po ; do python scripts/build/msgfmt.py --output-file "`dirname "$x"`/`basename "$x" .po`.mo" "$x" ; done
    - uses: actions/upload-artifact@main
      with:
        name: mame-language-${{ github.sha }}
        path: language/*/*.mo
        if-no-files-found: error
