name: Korg Prophecy no-ROM gates

on:
  push:
    # A push run audits the whole history above the public baseline, so a
    # merge commit landing on the publication branch is reported there at once
    # instead of in every open pull request.
    branches: [profligacy-public-v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The publication audit takes seconds and needs no build.  It runs on its own
  # so that a history finding neither waits for nor hides the test results.
  publication-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Every commit without old trees or files (about 30 MB): the pinned
          # official base and public history baseline are always present,
          # however far the branch has moved past them.
          fetch-depth: 0
          filter: tree:0
          # The audit reads the proposed branch tip, not GitHub's synthetic
          # merge commit; on push this is github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit the publishable delta and history
        env:
          # Set on pull requests only: there the audit checks just the commits
          # the pull request adds for merge commits.  An environment variable
          # rather than a flag, because the script comes from the pull request
          # and a branch from before this change has a copy without the flag.
          KORGPROPHECY_AUDIT_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/korgprophecy_publication_audit.py --content-only

  no-rom-unix:
    name: no-rom-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The tests need no history.  On a pull request they build GitHub's
      # merge of the branch into its target, so they report on what merging
      # would produce without the branch being rebased first.
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev
      - name: Install macOS build dependency
        if: runner.os == 'macOS'
        run: brew install sdl2
      - name: Build and run public gates
        env:
          JOBS: 4
        run: ./scripts/korgprophecy_no_rom_gate.sh --content-only --skip-publication-audit

  no-rom-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: UCRT64
          install: git make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-llvm mingw-w64-ucrt-x86_64-libc++ mingw-w64-ucrt-x86_64-sdl3
      - uses: actions/checkout@v6
      - name: Build and run public gates
        env:
          ARCHOPTS: "-fuse-ld=lld"
          JOBS: 3
          OSD: windows
          OVERRIDE_AR: llvm-ar
          OVERRIDE_CC: gcc
          OVERRIDE_CXX: g++
          PYTHON: python
          USE_SDL3: 1
        run: ./scripts/korgprophecy_no_rom_gate.sh --content-only --skip-publication-audit
