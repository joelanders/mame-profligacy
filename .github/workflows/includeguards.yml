name: 'Check #include guards'

on:
  push:
    branches: [master]
    paths:
    - '.github/workflows/**'
    - 'src/devices/**.h'
    - 'src/mame/**.h'
  # Not a Prophecy check: it ran twice per pull request push (push and
  # pull_request) and tests nothing the fork changes.  Keep it for master
  # and on demand, like the CI builds; pull requests use the no-ROM gate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Validate
      run: python3 scripts/build/check_include_guards.py src/devices src/mame
